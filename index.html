<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff8f1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<meta name="description" content="Dr. Dan's Chemistry Study Hub: games, textbook readings, and video lessons for CHEM 3A, 1A, 1B, and 3B at Fresno City College.">
<title>Dr. Dan’s Chemistry Study Hub</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/logo-32.png">
<link rel="apple-touch-icon" href="assets/logo-180.png">
<meta property="og:image" content="https://itsdrdan.github.io/games/assets/logo-512.png">
<style>
:root{
  --ink:#1f3a40;--muted:#5c7276;--soft:#7d9093;--line:#dde8e3;--bg:#f6faf7;--card:#fff;
  --brand:#23776c;--brand-ink:#17544c;--edge:#24473f;--gold:#d39b28;
  --c3A:#23776c;--c3A-bg:#e4f3ec;--c1A:#4757b3;--c1A-bg:#e8ebfb;--c1B:#b0533b;--c1B-bg:#fbebe4;--c3B:#86509b;--c3B-bg:#f2e8f7;
  --r:20px;--shadow:0 6px 24px #214c4510;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:6px}
.wrap{width:min(1180px,calc(100% - 40px));margin:auto}
#app:focus{outline:none}
.badge{letter-spacing:0}
.navlinks a.only-sm{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
[hidden]{display:none!important}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:#ffffffeb;backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.nav{min-height:68px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:850;letter-spacing:-.02em;font-size:1.08rem;white-space:nowrap}
.brand-icon{display:grid;place-items:center;width:40px;height:40px;border-radius:13px;background:#e2f2eb;font-size:1.25rem}
.brand small{color:var(--soft);font-weight:650}
.navlinks{display:flex;gap:6px;margin-left:auto;align-items:center}
.navlinks a{padding:8px 12px;border-radius:10px;text-decoration:none;font-weight:700;font-size:.92rem;color:#3b5a5c}
.navlinks a:hover,.navlinks a[aria-current=page]{background:#e9f3ee;color:var(--brand-ink)}
.topsearch{flex:1;max-width:380px;position:relative}
.topsearch input{width:100%;height:42px;border:1.5px solid #d3e2db;border-radius:12px;background:#f8fbf9;padding:0 14px 0 38px}
.topsearch::before{content:"🔎";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:.9rem;opacity:.7}

/* buttons (tactile, from the previous hub) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:9px 17px;border-radius:12px;border:2px solid var(--edge);box-shadow:0 4px 0 var(--edge);background:var(--brand);color:#fff;text-decoration:none;font-weight:780;cursor:pointer;transition:transform .14s,box-shadow .14s,background .14s}
.btn.secondary{background:#fff;color:var(--edge)}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--edge)}
.btn.secondary:hover{background:#eef6f1}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.btn.small{min-height:38px;padding:6px 12px;font-size:.88rem;box-shadow:0 3px 0 var(--edge)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid #cfdfd8;background:#fff;border-radius:100px;padding:6px 12px;font-size:.86rem;font-weight:650;color:#355457;cursor:pointer;text-decoration:none}
.chip:hover{border-color:var(--brand);background:#eef7f2}
.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}

/* hero */
.hero{background:radial-gradient(ellipse at 92% 18%,#f8e8ce 0,transparent 42%),radial-gradient(ellipse at 6% 95%,#e6e9fb 0,transparent 40%),linear-gradient(125deg,#edf7f0,#f7faf3);border-bottom:1px solid #dce9e1}
.hero-inner{padding:58px 0 50px;display:grid;gap:26px}
.eyebrow{font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#477e71;font-size:.74rem}
h1{font-size:clamp(2.2rem,5vw,3.7rem);line-height:1.06;letter-spacing:-.045em;margin:10px 0 12px;max-width:820px}
h1 span{color:var(--brand)}
.hero p.lead{font-size:clamp(1.02rem,2vw,1.17rem);color:#4f6a6d;max-width:680px;margin:0}
.bigsearch{position:relative;max-width:760px}
.bigsearch input{width:100%;height:64px;border:2px solid var(--edge);box-shadow:0 5px 0 var(--edge);border-radius:18px;padding:0 140px 0 54px;font-size:1.1rem;background:#fff}
.bigsearch::before{content:"🔎";position:absolute;left:20px;top:50%;transform:translateY(-55%);font-size:1.15rem}
.bigsearch .btn{position:absolute;right:9px;top:8px;min-height:44px;box-shadow:0 3px 0 var(--edge)}
.tryrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.88rem;color:var(--muted)}

/* course cards */
.section{padding:42px 0}
.section h2{font-size:clamp(1.5rem,3vw,2rem);letter-spacing:-.03em;margin:4px 0 6px}
.section .sub{color:var(--muted);margin:0 0 20px}
.courses{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.course-card{--c:var(--c3A);--cb:var(--c3A-bg);display:flex;flex-direction:column;gap:8px;text-decoration:none;background:#fff;border:2px solid var(--c);border-radius:var(--r);padding:20px;box-shadow:0 5px 0 var(--c);transition:transform .14s,box-shadow .14s;min-height:220px}
.course-card:hover{transform:translateY(-3px);box-shadow:0 8px 0 var(--c)}
.course-card .tag{align-self:flex-start;background:var(--cb);color:var(--c);font-weight:850;border-radius:10px;padding:5px 10px;font-size:.95rem;letter-spacing:-.01em}
.course-card h3{margin:4px 0 0;font-size:1.2rem;letter-spacing:-.02em;line-height:1.25}
.course-card p{margin:0;color:var(--muted);font-size:.9rem;line-height:1.5}
.course-card .stats{margin-top:auto;display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;font-weight:700;color:#4c6466}
.course-card .go{color:var(--c);font-weight:800}
[data-course="1A"]{--c:var(--c1A);--cb:var(--c1A-bg)}
[data-course="1B"]{--c:var(--c1B);--cb:var(--c1B-bg)}
[data-course="3B"]{--c:var(--c3B);--cb:var(--c3B-bg)}
[data-course="3A"]{--c:var(--c3A);--cb:var(--c3A-bg)}
.badge{display:inline-block;background:var(--cb,#eef3f1);color:var(--c,#3d5b5d);font-weight:800;font-size:.72rem;border-radius:100px;padding:3px 8px;white-space:nowrap}

/* three ways */
.ways{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.way{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.way b{display:block;font-size:1.05rem;margin:6px 0 4px}
.way p{margin:0;color:var(--muted);font-size:.92rem}
.way .em{font-size:1.6rem}

/* course page */
.course-head{background:linear-gradient(120deg,var(--cb),#fff 70%);border-bottom:1px solid var(--line)}
.course-head .wrap{padding:30px 0 24px}
.crumbs{font-size:.86rem;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.crumbs a{color:var(--muted)}
.course-head h1{font-size:clamp(1.9rem,4vw,2.8rem);margin:8px 0 6px}
.course-head h1 .badge{font-size:1rem;vertical-align:middle;margin-right:8px;padding:5px 11px}
.course-head p{margin:0;color:var(--muted)}
.bookline{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:.92rem}
.layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:28px;padding:28px 0 60px}
.toc{position:sticky;top:84px;align-self:start;max-height:calc(100vh - 100px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px}
.toc h2{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin:8px 10px}
.toc a{display:flex;gap:10px;align-items:baseline;padding:9px 10px;border-radius:12px;text-decoration:none;font-size:.92rem;line-height:1.3}
.toc a .n{flex:0 0 auto;font-weight:800;color:var(--c);font-size:.8rem;min-width:44px}
.toc a .dots{margin-left:auto;display:flex;gap:3px;flex:0 0 auto}
.toc a .dots i{width:7px;height:7px;border-radius:50%;background:#cfdcd6}
.toc a .dots i.on{background:var(--c)}
.toc a:hover{background:#f2f7f4}
.toc a[aria-current=true]{background:var(--cb);font-weight:750}
.toc-mobile{display:none}
.chapter h2.ct{font-size:clamp(1.6rem,3.2vw,2.3rem);letter-spacing:-.035em;margin:2px 0 4px;line-height:1.15}
.chapter .kicker{font-weight:800;color:var(--c);letter-spacing:.06em;text-transform:uppercase;font-size:.78rem}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);margin-top:18px}
.panel h3{margin:0 0 12px;font-size:1.1rem;display:flex;align-items:center;gap:8px}
.panel h3 .count{margin-left:auto;font-size:.8rem;color:var(--soft);font-weight:700}
.concepts{display:flex;flex-wrap:wrap;gap:7px}
.empty-note{color:var(--muted);font-size:.92rem;background:#f7faf8;border:1px dashed #cfdcd6;border-radius:14px;padding:14px}
.sections{list-style:none;margin:0;padding:0;columns:2;column-gap:24px}
.sections li{break-inside:avoid;padding:5px 0}
.sections li.sub{padding-left:18px;font-size:.92rem}
.sections a{text-decoration:none;display:flex;gap:8px}
.sections a:hover span:last-child{text-decoration:underline}
.sections .sn{color:var(--c);font-weight:750;min-width:46px;font-variant-numeric:tabular-nums}
.chapters-overview{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.ch-card{display:flex;flex-direction:column;gap:6px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;text-decoration:none;box-shadow:var(--shadow);transition:border-color .14s,transform .14s}
.ch-card:hover{border-color:var(--c);transform:translateY(-2px)}
.ch-card .n{font-weight:800;color:var(--c);font-size:.8rem}
.ch-card b{line-height:1.3}
.ch-card .meta{display:flex;gap:10px;font-size:.78rem;color:var(--muted);font-weight:650;margin-top:auto}

/* game + video cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.game{display:flex;flex-direction:column;background:#fff;border:1px solid #dfe9e2;border-radius:18px;padding:18px;box-shadow:var(--shadow);min-height:210px}
.game-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.game .icon{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:1.5rem;background:#e7f1fa;flex:0 0 auto}
.game .badges{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.game h4{margin:14px 0 4px;font-size:1.08rem;letter-spacing:-.02em;line-height:1.3}
.game p{margin:0 0 14px;color:var(--muted);font-size:.9rem;line-height:1.55}
.game .actions{margin-top:auto;display:flex;gap:8px}
.play{flex:1;display:flex;justify-content:space-between;align-items:center;min-height:44px;padding:8px 14px;border-radius:11px;border:2px solid var(--edge);box-shadow:0 3px 0 var(--edge);background:#e6f2eb;color:#214c40;font-weight:800;text-decoration:none;cursor:pointer;transition:transform .14s,box-shadow .14s,background .14s}
.play::after{content:"→";font-size:1.15rem}
.play:hover{background:var(--brand);color:#fff;transform:translateY(-2px);box-shadow:0 5px 0 var(--edge)}
.newtab{display:grid;place-items:center;width:44px;min-height:44px;border-radius:11px;border:2px solid #b9cdc5;text-decoration:none;color:#3b5a5c;font-weight:800}
.newtab:hover{border-color:var(--edge);background:#f2f7f4}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.video{display:flex;flex-direction:column;text-align:left;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;padding:0;box-shadow:var(--shadow);transition:transform .14s,border-color .14s}
.video:hover{transform:translateY(-2px);border-color:#a9ccbc}
.video .thumb{position:relative;aspect-ratio:16/9;background:#dfe9e4 center/cover no-repeat}
.video .thumb::after{content:"▶";position:absolute;inset:auto auto 10px 10px;width:36px;height:36px;border-radius:50%;background:#ffffffe6;display:grid;place-items:center;font-size:.85rem;color:#b3261e}
.video .vt{padding:10px 12px 12px;font-weight:700;font-size:.92rem;line-height:1.35}
.video .vt small{display:block;color:var(--soft);font-weight:600;font-size:.76rem;margin-top:4px}
.moments{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.moment{border:1.5px solid #cfdfd8;background:#f8fbf9;border-radius:9px;padding:5px 9px;font-size:.82rem;cursor:pointer}
.moment b{color:#b3261e;margin-right:4px;font-variant-numeric:tabular-nums}
.moment:hover{border-color:var(--brand)}
.playlists{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

/* search */
.search-page{padding:30px 0 60px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 6px}
.filters strong{font-size:.78rem;letter-spacing:.08em;color:var(--soft);margin-right:4px}
.rgroup{margin-top:26px}
.rgroup h3{font-size:1rem;margin:0 0 10px;display:flex;gap:8px;align-items:center}
.rgroup h3 .count{color:var(--soft);font-size:.82rem}
.rlist{display:grid;gap:10px}
.ritem{display:flex;gap:14px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;text-decoration:none;text-align:left;cursor:pointer;width:100%}
.ritem:hover{border-color:#a9ccbc;background:#fbfdfc}
.ritem .ri{flex:0 0 auto;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--cb,#eef3f1);font-size:1.1rem}
.ritem .rt{font-weight:750;line-height:1.35}
.ritem .rs{color:var(--muted);font-size:.88rem;margin-top:2px}
.ritem mark{background:#fdeeb5;color:inherit;border-radius:3px;padding:0 1px}
.ritem .ts{font-weight:800;color:#b3261e;font-variant-numeric:tabular-nums}
.ritem img{width:120px;aspect-ratio:16/9;object-fit:cover;border-radius:9px;flex:0 0 auto;background:#dfe9e4}
.noresults{background:#fff;border:1px dashed #cbd8d2;border-radius:16px;padding:26px;color:var(--muted)}

/* player + modal */
.player{border:1px solid #d5e2dc;border-radius:var(--r);background:#fff;overflow:hidden;box-shadow:var(--shadow);margin:24px 0 60px}
.player-bar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 18px;background:#edf6f0}
.player-bar h2{margin:2px 0 0;font-size:1.25rem}
.player-bar .btns{display:flex;gap:8px;flex-wrap:wrap}
.player iframe{display:block;width:100%;height:80vh;min-height:540px;border:0;background:#f8faff}
.player:fullscreen{display:flex;flex-direction:column;border-radius:0}
.player:fullscreen iframe{flex:1;height:auto}
.player .related{padding:12px 18px;font-size:.9rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
dialog.vmodal{border:0;padding:0;border-radius:18px;width:min(960px,94vw);background:#fff;box-shadow:0 30px 90px #0b1f1c55}
dialog.vmodal::backdrop{background:#0d221ecc}
.vmodal .vbar{display:flex;align-items:center;gap:10px;padding:12px 14px}
.vmodal .vbar b{flex:1;line-height:1.3}
.vmodal .frame{aspect-ratio:16/9;background:#000}
.vmodal iframe{width:100%;height:100%;border:0;display:block}
.vmodal .vfoot{padding:10px 14px 14px;font-size:.85rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:10px;align-items:center}

.footer{border-top:1px solid var(--line);padding:24px 0;color:var(--soft);font-size:.85rem}
.footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.status{font-size:.8rem;color:var(--soft)}

@media (max-width:980px){.courses{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.toc{display:none}.toc-mobile{display:block}.sections{columns:1}}
@media (max-width:640px){
  .wrap{width:calc(100% - 28px)}
  .nav{gap:10px;min-height:60px}.brand small{display:none}.navlinks a.hide-sm{display:none}.navlinks a.only-sm{display:inline-block}.topsearch{display:none}
  .hero-inner{padding:36px 0 34px}
  .bigsearch input{height:56px;padding:0 16px 0 46px;font-size:1rem}.bigsearch .btn{display:none}.bigsearch::before{left:16px}
  .courses{grid-template-columns:1fr}.course-card{min-height:0}
  .ways{grid-template-columns:1fr}
  .ritem img{width:92px}
  .player iframe{min-height:480px;height:76vh}
}
.toc-mobile select{width:100%;height:50px;border:2px solid var(--edge);border-radius:12px;padding:0 12px;background:#fff;font-weight:700}
.toc-mobile{margin-bottom:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* ===== Soft & fun theme ===== */
:root{
  --ink:#3a3157;--muted:#6f6889;--soft:#9a93b3;--line:#ece4f4;--bg:#fff8f1;
  --brand:#7563d9;--brand-ink:#5546b8;--edge:#5a4d96;--gold:#ffb547;
  --c3A:#2a9478;--c3A-bg:#d9f4ea;--c1A:#5468d4;--c1A-bg:#e3e8ff;--c1B:#d9654f;--c1B-bg:#ffe5dc;--c3B:#9555bd;--c3B-bg:#f1e3fa;
  --r:24px;--shadow:0 8px 28px #5a4d9614;
}
body{background:var(--bg);color:var(--ink);font-family:Nunito,"Segoe UI",system-ui,-apple-system,sans-serif;font-weight:600}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(circle at 8% 12%,#ffe3ec 0,transparent 22%),radial-gradient(circle at 92% 8%,#e3f0ff 0,transparent 24%),
  radial-gradient(circle at 85% 85%,#e4f8ee 0,transparent 26%),radial-gradient(circle at 12% 88%,#fff1c9 0,transparent 22%)}
h1,h2,h3,.brand,.btn,.chip,.play{font-family:Nunito,"Segoe UI",system-ui,sans-serif}
h1{font-weight:900;letter-spacing:-.035em} h2{font-weight:900} h3{font-weight:850}
.top{background:#fffaf5e8;border-bottom:1px solid var(--line)}
.brand-icon{background:linear-gradient(135deg,#ffe0ea,#e1e6ff);border-radius:14px}
.navlinks a{color:var(--ink)} .navlinks a:hover,.navlinks a[aria-current=page]{background:#efe9ff;color:var(--brand-ink)}
.topsearch input{background:#fff;border-color:#e4daf2;border-radius:999px}
.hero{background:linear-gradient(120deg,#ffe9f0 0%,#f1ebff 45%,#e3f6ff 75%,#e9fbef 100%);border-bottom:0;position:relative;overflow:hidden}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;pointer-events:none;opacity:.7;animation:bob 9s ease-in-out infinite}
.hero::before{width:220px;height:220px;right:6%;top:-40px;background:radial-gradient(circle at 35% 35%,#fff,#ffd6a8 60%,#ffc08a);filter:blur(1px)}
.hero::after{width:120px;height:120px;right:24%;bottom:-30px;background:radial-gradient(circle at 35% 35%,#fff,#c9b8ff 60%,#ad97ff);animation-delay:-4s}
@keyframes bob{50%{transform:translateY(14px)}}
.hero-inner{position:relative;z-index:1}
.eyebrow{color:#8a5fc9;letter-spacing:.14em}
h1 span{background:linear-gradient(90deg,#ff7a8a,#9a6bff 55%,#36b39a);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.lead{color:#5e5679}
.btn{background:var(--brand);border-color:var(--edge);box-shadow:0 4px 0 var(--edge);border-radius:999px;padding-inline:20px}
.btn.secondary{background:#fff;color:var(--edge)} .btn.secondary:hover{background:#f4f0ff}
.btn:hover{box-shadow:0 6px 0 var(--edge)} .btn:active{box-shadow:0 1px 0 var(--edge)}
.bigsearch input{border-color:var(--edge);box-shadow:0 5px 0 var(--edge);border-radius:999px;padding-left:56px}
.bigsearch .btn{border-radius:999px;top:9px}
.chip{border-color:#e2d8f2;color:#4d4470;border-radius:999px;background:#ffffffd9}
.chip:hover{border-color:var(--brand);background:#f4f0ff}
.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand)}
.course-card{border-radius:28px;box-shadow:0 6px 0 var(--c);background:linear-gradient(180deg,#fff 60%,var(--cb))}
.course-card:hover{box-shadow:0 10px 0 var(--c);transform:translateY(-4px) rotate(-.4deg)}
.course-card .tag{border-radius:999px;padding:6px 13px}

<script>
'use strict';
/* ---------- data ---------- */
const D = window.HUB_DATA;
const USER = 'ItsDrDan', CACHE_KEY = 'itsdrdan-hub-games-v2', TTL = 6 * 3600 * 1000;
const COURSE_ORDER = ['3A', '1A', '1B', '3B'];
const courseById = Object.fromEntries(D.courses.map(c => [c.id, c]));
const games = new Map(D.games.map(g => [g.id, {...g, tags: []}]));
const videos = new Map(D.videos.map(v => [v.id, {...v, moments: v.moments || []}]));
const playlistTitles = {...D.playlists};
let transcripts = null, transcriptState = 'idle'; // idle | loading | ready | none
const $ = s => document.querySelector(s);
const app = $('#app');

/* ---------- helpers ---------- */
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const fmtTime = s => { s = Math.max(0, Math.floor(s)); const hh = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60; return (hh ? hh + ':' + String(m).padStart(2, '0') : m) + ':' + String(ss).padStart(2, '0'); };
const thumb = id => `https://i.ytimg.com/vi/${encodeURIComponent(id)}/mqdefault.jpg`;
const ytUrl = (id, t) => `https://www.youtube.com/watch?v=${encodeURIComponent(id)}${t ? '&t=' + Math.floor(t) + 's' : ''}`;
const plUrl = id => `https://www.youtube.com/playlist?list=${encodeURIComponent(id)}`;
function courseBadge(id) { return h('span', {class: 'badge', 'data-course': id}, 'CHEM ' + id); }
function setTitle(t) { document.title = t ? t + ' · Dr. Dan’s Chemistry Study Hub' : 'Dr. Dan’s Chemistry Study Hub'; }
function remember(k, v) { try { localStorage.setItem('hub-' + k, v); } catch {} }
function recall(k) { try { return localStorage.getItem('hub-' + k); } catch { return null; } }
function coursesOf(value) { const s = Array.isArray(value) ? value.join(' ') : String(value || ''); return [...new Set([...s.toUpperCase().matchAll(/(?:CHEM\s*)?(3A|3B|1A|1B)\b/g)].map(m => m[1]))]; }

/* ---------- search normalization ---------- */
const SYN = [
  ['sig figs?', 'significant figures'], ['sigfigs?', 'significant figures'], ['imfs?', 'intermolecular forces'], ['redox', 'oxidation reduction'],
  ['le ?chatelier', 'le chatelier'], ['pv ?= ?nrt', 'ideal gas law'], ['e ?config(uration)?s?', 'electron configuration'], ['ice table', 'ice table equilibrium'],
  ['net ionic', 'net ionic equations'], ['lewis dots?', 'lewis structures'], ['h ?bond(ing|s)?', 'hydrogen bonding'], ['mo theory', 'molecular orbital theory'],
  ['stoich', 'stoichiometry'], ['ksp', 'ksp solubility product'], ['naming', 'naming nomenclature'], ['nomenclature', 'naming nomenclature'], ['vsepr', 'vsepr shape geometry'],
];
function norm(s) { return String(s || '').normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[’']/g, '').replace(/[^a-z0-9+\-.]+/g, ' ').trim(); }
function stem(w) { if (w.length > 4 && w.endsWith('ies')) return w.slice(0, -3) + 'y'; if (w.length > 4 && /(ses|xes|ches|shes)$/.test(w)) return w.slice(0, -2); if (w.length > 3 && w.endsWith('s') && !w.endsWith('ss')) return w.slice(0, -1); return w; }
const STOP = new Set(['the', 'a', 'an', 'of', 'and', 'to', 'in', 'how', 'what', 'is', 'for', 'on', 'do', 'i', 'with', 'chem', 'help', 'me', 'my']);
function tokens(s) { let t = norm(s); for (const [re, rep] of SYN) t = t.replace(new RegExp('\\b' + re + '\\b', 'g'), rep); return t.split(/\s+/).filter(w => w && !STOP.has(w)).map(stem); }
function haystack(...parts) { return ' ' + tokens(parts.flat().join(' ')).join(' ') + ' '; }
function scoreText(hay, qt) { let s = 0; for (const w of qt) { if (hay.includes(' ' + w + ' ')) s += 3; else if (w.length > 2 && hay.includes(' ' + w)) s += 2; else return 0; } return s; }
function highlight(text, qt) {
  let out = esc(text);
  const words = [...new Set(qt.filter(w => w.length > 1))].sort((a, b) => b.length - a.length);
  for (const w of words) out = out.replace(new RegExp('\\b(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '[a-z]*)', 'gi'), '<mark>$1</mark>');
  return out;
}

/* ---------- index ---------- */
let INDEX = [];
function buildIndex() {
  INDEX = [];
  for (const c of D.courses) for (const ch of c.chapters) {
    INDEX.push({type: 'chapter', course: c.id, ch, hay: haystack(ch.title, ch.label, 'chapter ' + ch.id), hayDeep: haystack(ch.concepts, (window.HUB_GUIDES || {})[c.id + ':' + ch.id]?.s || '')});
    for (const con of ch.concepts) INDEX.push({type: 'concept', course: c.id, ch, text: con, hay: haystack(con)});
    if (ch.read) for (const [n, t, url] of ch.read.sections) INDEX.push({type: 'section', course: c.id, ch, num: n, text: t, url, hay: haystack(t)});
  }
  for (const g of games.values()) INDEX.push({type: 'game', g, hay: haystack(g.title, g.blurb, g.tags || [], g.description || '')});
  for (const v of videos.values()) {
    INDEX.push({type: 'video', v, hay: haystack(v.title, playlistTitles[v.playlist] || '')});
    for (const [t, label] of v.moments) INDEX.push({type: 'moment', v, t, text: label, hay: haystack(label, v.title)});
  }
}
function chaptersUsing(kind, id) {
  const out = [];
  for (const c of D.courses) for (const ch of c.chapters) if ((kind === 'game' ? ch.games : ch.videos).includes(id)) out.push({c, ch});
  return out;
}
function videoCourses(id) { return [...new Set(chaptersUsing('video', id).map(x => x.c.id))]; }

/* ---------- components ---------- */
function gameCard(g, courseCtx) {
  const cs = g.courses?.length ? g.courses : coursesOf(g.course);
  return h('article', {class: 'game'},
    h('div', {class: 'game-top'}, h('span', {class: 'icon', 'aria-hidden': 'true'}, g.icon || '🧪'), h('div', {class: 'badges'}, cs.map(courseBadge))),
    h('h4', {}, g.title),
    h('p', {}, g.blurb || g.description || ''),
    h('div', {class: 'actions'},
      h('a', {class: 'play', href: '#/play/' + encodeURIComponent(g.id) + (courseCtx ? '?from=' + courseCtx : '')}, 'Play'),
      h('a', {class: 'newtab', href: g.url, target: '_blank', rel: 'noopener', title: 'Open in a new tab', 'aria-label': 'Open ' + g.title + ' in a new tab'}, '↗')));
}
function videoCard(v) {
  const card = h('button', {class: 'video', type: 'button', onclick: () => openVideo(v.id, 0)},
    h('span', {class: 'thumb', style: `background-image:url('${thumb(v.id)}')`, 'aria-hidden': 'true'}),
    h('span', {class: 'vt'}, v.title, h('small', {}, [v.duration ? Math.round(v.duration / 60) + ' min' : '', v.playlist && playlistTitles[v.playlist] ? playlistTitles[v.playlist] : ''].filter(Boolean).join(' · ') || 'Dr. Dan on YouTube')));
  if (!v.moments.length) return card;
  return h('div', {}, card, h('div', {class: 'moments', 'aria-label': 'Key moments in ' + v.title},
    v.moments.map(([t, label]) => h('button', {class: 'moment', type: 'button', onclick: () => openVideo(v.id, t)}, h('b', {}, fmtTime(t)), label))));
}

/* ---------- video modal ---------- */
const vmodal = $('#vmodal');
function openVideo(id, t = 0) {
  const v = videos.get(id) || {id, title: 'Video lesson', moments: []};
  $('#vtitle').textContent = v.title;
  $('#vyt').href = ytUrl(id, t);
  $('#vframe').src = `https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?rel=0&modestbranding=1&autoplay=1${t ? '&start=' + Math.floor(t) : ''}`;
  const foot = $('#vfoot'); foot.replaceChildren();
  if (v.moments.length) { foot.append(h('span', {}, 'Jump to:')); for (const [mt, label] of v.moments) foot.append(h('button', {class: 'moment', type: 'button', onclick: () => openVideo(id, mt)}, h('b', {}, fmtTime(mt)), label)); }
  const used = chaptersUsing('video', id);
  if (used.length) { foot.append(h('span', {}, 'Used in:')); for (const {c, ch} of used) foot.append(h('a', {class: 'chip', href: `#/course/${c.id}/${ch.id}`, onclick: closeVideo}, `${c.name} ${ch.label}`)); }
  if (!vmodal.open) vmodal.showModal();
}
function closeVideo() { $('#vframe').src = 'about:blank'; if (vmodal.open) vmodal.close(); }
$('#vclose').addEventListener('click', closeVideo);
vmodal.addEventListener('close', () => { $('#vframe').src = 'about:blank'; });
vmodal.addEventListener('click', e => { if (e.target === vmodal) closeVideo(); });

/* ---------- views ---------- */
function viewHome() {
  setTitle('');
  const last = recall('course');
  const counts = id => { const c = courseById[id]; const gs = new Set(c.chapters.flatMap(ch => ch.games)); const vs = new Set(c.chapters.flatMap(ch => ch.videos)); return {ch: c.chapters.length, g: gs.size, v: vs.size}; };
  const search = h('form', {class: 'bigsearch', role: 'search', onsubmit: e => { e.preventDefault(); go('#/search?q=' + encodeURIComponent(e.target.q.value.trim())); }},
    h('label', {class: 'sr', for: 'heroQ'}, 'What do you need to study?'),
    h('input', {id: 'heroQ', name: 'q', type: 'search', placeholder: 'Try “limiting reactant”, “buffers”, or “3A chapter 8”', autocomplete: 'off'}),
    h('button', {class: 'btn', type: 'submit'}, 'Search'));
  const tries = ['limiting reactant', 'net ionic equations', 'VSEPR', 'partial pressure', 'electron configuration', 'Fischer projections', '3A chapter 11'];
  app.replaceChildren(
    h('section', {class: 'hero'}, h('img', {class: 'watermark', src: 'assets/logo-mark.svg', alt: '', 'aria-hidden': 'true'}), h('div', {class: 'wrap hero-inner'},
      h('div', {}, h('div', {class: 'eyebrow'}, 'Dr. Dan’s chemistry study hub'),
        h('h1', {html: 'Find exactly what to study, <span>then practice it.</span>'}),
        h('p', {class: 'lead'}, 'Pick your course and chapter, or search any topic. You’ll get the textbook reading, Dr. Dan’s video lessons, and the games that practice it.')),
      search,
      h('div', {class: 'tryrow'}, h('span', {}, 'Try:'), tries.map(t => h('a', {class: 'chip', href: '#/search?q=' + encodeURIComponent(t)}, t))),
      last && courseById[last] ? h('div', {}, h('a', {class: 'btn secondary', href: '#/course/' + last}, `Continue in CHEM ${last} →`)) : null)),
    h('section', {class: 'section wrap', id: 'courses'},
      h('div', {class: 'eyebrow'}, 'Choose your course'), h('h2', {}, 'Which class are you in?'),
      h('p', {class: 'sub'}, 'Each course is organized the way your class runs: chapter by chapter, matched to the course outline.'),
      h('div', {class: 'courses'}, COURSE_ORDER.map(id => {
        const c = courseById[id], n = counts(id);
        return h('a', {class: 'course-card', 'data-course': id, href: '#/course/' + id},
          h('span', {class: 'tag'}, c.name), h('h3', {}, c.title), h('p', {}, c.who),
          h('div', {class: 'stats'}, h('span', {}, `📖 ${n.ch} ${id === '3B' ? 'units' : 'chapters'}`), h('span', {}, `🎮 ${n.g} games`), n.v ? h('span', {}, `▶️ ${n.v} videos`) : null),
          h('span', {class: 'go'}, 'Open course →'));
      }))),
    h('section', {class: 'section wrap', style: 'padding-top:0'},
      h('div', {class: 'ways'},
        h('div', {class: 'way'}, h('span', {class: 'em'}, '📖'), h('b', {}, 'Read'), h('p', {}, 'Every chapter links straight to the matching section of your free textbook.')),
        h('div', {class: 'way'}, h('span', {class: 'em'}, '▶️'), h('b', {}, 'Watch'), h('p', {}, 'Dr. Dan’s lessons, with key moments so you can jump to the part you need.')),
        h('div', {class: 'way'}, h('span', {class: 'em'}, '🎮'), h('b', {}, 'Practice'), h('p', {}, 'Study games with hints, step-by-step help, and room to try again.')))));
}

function viewCourse(cid, chid) {
  const c = courseById[cid];
  if (!c) return viewNotFound();
  remember('course', cid);
  const ch = chid ? c.chapters.find(x => x.id === chid) : null;
  setTitle(ch ? `${c.name} ${ch.label}: ${ch.title}` : c.name);
  const book = c.book;
  const head = h('section', {class: 'course-head', 'data-course': cid}, h('img', {class: 'watermark small', src: 'assets/logo-mark.svg', alt: '', 'aria-hidden': 'true'}), h('div', {class: 'wrap'},
    h('nav', {class: 'crumbs', 'aria-label': 'Breadcrumb'}, h('a', {href: '#/'}, 'Courses'), '›', ch ? h('a', {href: '#/course/' + cid}, c.name) : h('span', {}, c.name), ch ? ['›', h('span', {}, ch.label)] : null),

    h('img', {src: thumb(r.v.id), alt: '', loading: 'lazy'}), h('span', {}, h('div', {class: 'rt'}, h('span', {class: 'ts'}, fmtTime(r.t)), ' ', h('span', {html: highlight(r.text, qt)})), h('div', {class: 'rs'}, r.v.title))));
  group('Said in Dr. Dan’s videos', '💬', groups.transcript, r => h('button', {class: 'ritem', type: 'button', onclick: () => openVideo(r.v.id, Math.max(0, r.t - 2))},
    h('img', {src: thumb(r.v.id), alt: '', loading: 'lazy'}), h('span', {}, h('div', {class: 'rt'}, h('span', {class: 'ts'}, fmtTime(r.t)), ' ', r.v.title), h('div', {class: 'rs', html: '“…' + highlight(r.text, qt) + '…”'}))));
  group('Textbook sections', '📖', groups.section, r => { const c = courseById[r.course]; return h('a', {class: 'ritem', href: r.url, target: '_blank', rel: 'noopener', 'data-course': c.id},
    h('span', {class: 'ri'}, '📖'), h('span', {}, h('div', {class: 'rt'}, `${r.num} `, h('span', {html: highlight(r.text, qt)}), ' ↗'), h('div', {class: 'rs'}, `${c.book.title} · used in `, courseBadge(c.id)))); });
  if (transcriptState === 'loading') box.append(h('p', {class: 'status'}, 'Searching video transcripts…'));
}

function viewNotFound(msg) { setTitle('Not found'); app.replaceChildren(h('section', {class: 'section wrap'}, h('h2', {}, 'Hmm, that page isn’t here.'), h('p', {class: 'sub'}, msg || 'Try the course list or search.'), h('a', {class: 'btn', href: '#/'}, 'Go to courses'))); }

/* ---------- router ---------- */
function go(hash) { if (location.hash === hash) route(); else location.hash = hash; }
function route() {
  closeVideo();
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  const raw = location.hash.replace(/^#/, '') || '/';
  const [path, qs] = raw.split('?');
  const params = new URLSearchParams(qs || '');
  const parts = path.split('/').filter(Boolean).map(decodeURIComponent);
  document.querySelectorAll('[data-nav]').forEach(a => a.removeAttribute('aria-current'));
  if (!parts.length) { viewHome(); document.querySelector('[data-nav=home]')?.setAttribute('aria-current', 'page'); }
  else if (parts[0] === 'course') viewCourse((parts[1] || '').toUpperCase(), parts[2]);
  else if (parts[0] === 'games') { viewGames(params); document.querySelector('[data-nav=games]')?.setAttribute('aria-current', 'page'); }
  else if (parts[0] === 'play') viewPlay(parts[1], params);
  else if (parts[0] === 'search') viewSearch(params);
  else if (['3a', '1a', '1b', '3b'].includes(parts[0].toLowerCase())) viewCourse(parts[0].toUpperCase(), parts[1]);
  else viewNotFound();
  window.scrollTo(0, 0);
  app.focus({preventScroll: true});
}
window.addEventListener('hashchange', route);
$('#topSearchForm').addEventListener('submit', e => { e.preventDefault(); const q = $('#topSearch').value.trim(); if (q) go('#/search?q=' + encodeURIComponent(q)); });

/* ---------- optional data: YouTube catalog + transcripts (built by tools/update_youtube.py) ---------- */
async function loadYouTube() {
  try {
    const r = await fetch('data/youtube.json', {cache: 'no-cache'}); if (!r.ok) return;
    const y = await r.json();
    Object.assign(playlistTitles, y.playlists || {});
    for (const v of y.videos || []) {
      const cur = videos.get(v.id) || {id: v.id, title: v.title, moments: []};
      cur.title = cur.title || v.title; cur.playlist = cur.playlist || (v.playlists || [])[0] || null;
      if (v.chapters?.length && !cur.moments.length) cur.moments = v.chapters;
      videos.set(v.id, cur);
    }
    // attach playlist videos to chapters that list that playlist
    const byPl = {}; for (const v of y.videos || []) for (const p of v.playlists || []) (byPl[p] ||= []).push(v.id);
    for (const c of D.courses) for (const ch of c.chapters) for (const p of ch.playlists) for (const id of byPl[p] || []) if (!ch.videos.includes(id)) ch.videos.push(id);
    buildIndex(); route();
  } catch {}
}
async function loadTranscripts() {
  transcriptState = 'loading';
  try {
    const r = await fetch('data/transcripts.json', {cache: 'no-cache'}); if (!r.ok) throw 0;
    transcripts = await r.json(); transcriptState = 'ready';
    for (const [id, title] of Object.entries(transcripts.titles || {})) if (!videos.has(id)) videos.set(id, {id, title, moments: []});
  } catch { transcriptState = 'none'; }
}

/* ---------- live game discovery (any public ItsDrDan repo with GitHub Pages + meta.json) ---------- */
function mergeMeta(repo, meta) {
  if (!meta || typeof meta !== 'object' || Array.isArray(meta)) return;
  const st = String(meta.status || '').toLowerCase();
  if (['hidden', 'draft', 'disabled', 'private', 'archived', 'under construction', 'coming soon'].includes(st) || meta.display === false || meta.visible === false) return;
  const id = repo.toLowerCase();
  const cur = games.get(id);
  const tags = Array.isArray(meta.tags) ? meta.tags.filter(t => typeof t === 'string').slice(0, 40) : [];
  if (cur) { cur.tags = tags; cur.description = String(meta.description || ''); return; }
  const title = String(meta.title || meta.name || '').trim(); if (!title) return;
  const blurb = String(meta.summary || meta.shortDescription || meta.description || '').replace(/\s+/g, ' ').trim();
  games.set(id, {id, title, icon: String(meta.icon || '🧪').slice(0, 8), blurb: blurb.length > 150 ? (blurb.match(/^.{30,150}?[.!?](\s|$)/)?.[0] || blurb.slice(0, 147) + '…') : blurb,
    courses: coursesOf(meta.course), tags, description: String(meta.description || ''), url: `https://itsdrdan.github.io/${encodeURIComponent(repo)}/`, discovered: true});
}
async function discoverGames(force = false) {
  let cached = null; try { cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); } catch {}
  if (cached?.metas) { for (const [repo, meta] of cached.metas) mergeMeta(repo, meta); buildIndex(); }
  if (!force && cached && Date.now() - cached.time < TTL) return;
  try {
    let list = [], page = 1;
    while (page <= 5) { const r = await fetch(`https://api.github.com/users/${USER}/repos?per_page=100&page=${page}`, {headers: {Accept: 'application/vnd.github+json'}}); if (!r.ok) throw 0; const chunk = await r.json(); list.push(...chunk); if (chunk.length < 100) break; page++; }
    const hide = new Set((D.hide || []).map(x => x.toLowerCase()));
    const repos = list.filter(r => r.has_pages && !r.archived && !/\.github\.io$/i.test(r.name) && !hide.has(r.name.toLowerCase()));
    const metas = [];
    await Promise.all(repos.map(async r => { try { const m = await fetch(`https://itsdrdan.github.io/${encodeURIComponent(r.name)}/meta.json`, {cache: 'no-cache'}); if (m.ok) metas.push([r.name, await m.json()]); } catch {} }));
    for (const [repo, meta] of metas) mergeMeta(repo, meta);
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({time: Date.now(), metas})); } catch {}
    buildIndex();
    if (location.hash.startsWith('#/games')) route();
  } catch { $('#status').textContent = ''; }
}

/* ---------- start ---------- */
buildIndex();
route();
discoverGames();
loadYouTube();
</script>
