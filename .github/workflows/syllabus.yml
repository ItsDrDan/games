name: Update syllabus calendar
on:
  schedule:
    - cron: "17 14 * * 1"   # every Monday ~7 AM Pacific
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read Dr. Dan's public syllabi from Simple Syllabus
        run: python3 tools/update_syllabus.py
      - name: Save changes
        run: |
          if [ -n "$(git status --porcelain data/syllabus.json)" ]; then
            git config user.name "study-hub-bot"
            git config user.email "study-hub-bot@users.noreply.github.com"
            git add data/syllabus.json
            git commit -m "Update syllabus calendar from Simple Syllabus"
            git push
          else
            echo "Syllabus unchanged."
          fi
